services:
  app:
    build: .
    container_name: orlando-2027
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/orlando.db"
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data

# Cloudflare Tunnel não está aqui porque você já tem um tunnel
# rodando no host (mac-mini-home) que cuida do orlando.pessanhaserver.com.br
# apontando pra http://192.168.3.253:3000
